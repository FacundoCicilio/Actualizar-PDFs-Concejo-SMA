name: Videos del Concejo
# Workflow aparte de auto-fetch.yml para poder correrlo a mano sin disparar el paso de Instagram.
on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      video_id:
        description: "Solo transcribir este video (vacío: revisar el canal como siempre)"
        required: false
        default: ""
concurrency:
  group: concejo-videos  # el índice es leer-modificar-escribir: nunca dos corridas a la vez
  cancel-in-progress: false
jobs:
  registrar:
    if: ${{ !inputs.video_id }}
    runs-on: ubuntu-latest
    outputs:
      nuevos: ${{ steps.registrar.outputs.nuevos }}
    permissions:
      contents: read
      issues: write   # Issue "nuevo-video-concejo"
      actions: write  # para el keepalive
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install requests huggingface_hub
      - name: Run tests
        run: |
          pip install pyyaml
          python -m unittest test_concejo_videos test_concejo_transcribir
      - name: Registrar videos
        id: registrar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python concejo_videos.py
      # GitHub desactiva los crons tras 60 días sin actividad en el repo.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/concejo-videos.yml/enable"

  # medium en 2 vCPU va a ~0,5x tiempo real: cada tramo de 15 min es un job con su propio límite de 60.
  planificar:
    needs: registrar
    if: ${{ always() && (inputs.video_id || (needs.registrar.result == 'success' && needs.registrar.outputs.nuevos != '[]' && needs.registrar.outputs.nuevos != '')) }}
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.plan.outputs.partes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests huggingface_hub pyyaml
      - id: plan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
          NUEVOS: ${{ needs.registrar.outputs.nuevos }}
        run: |
          python concejo_transcribir.py --plan ${VIDEO_ID:-$(echo "$NUEVOS" | jq -r '.[]')}

  transcribir:
    needs: planificar
    if: ${{ always() && needs.planificar.result == 'success' && needs.planificar.outputs.partes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false  # un tramo caído queda marcado como faltante; los demás siguen
      matrix:
        parte: ${{ fromJSON(needs.planificar.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests huggingface_hub pyyaml faster-whisper yt-dlp
      - name: Transcribir tramo
        # 45 min de transcripción: deja margen para instalar y bajar el audio antes del corte de 60.
        run: |
          python concejo_transcribir.py --parte ${{ matrix.parte.video }} ${{ matrix.parte.desde }} ${{ matrix.parte.hasta }} ${{ matrix.parte.total }} --minutos 45 --salida partes
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte.video }}-${{ matrix.parte.desde }}
          path: partes/
          retention-days: 7

  unir:
    needs: [planificar, transcribir]
    if: ${{ always() && needs.planificar.result == 'success' && needs.planificar.outputs.partes != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # comentario con los hallazgos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests huggingface_hub pyyaml
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: partes
          merge-multiple: true
      - name: Unir, subir al dataset y comentar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python concejo_transcribir.py --unir partes
