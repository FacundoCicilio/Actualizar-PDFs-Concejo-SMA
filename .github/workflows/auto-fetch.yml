name: Auto Fetch Actas
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # para el keepalive
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest -v test_store
      - name: Run auto_fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          SOURCE_URL: "https://prensacd.cdsma.gob.ar/ordenes-del-dia-2026/"
        run: |
          python auto_fetch.py
      # GitHub desactiva los crons tras 60 días sin actividad en el repo; re-habilitarlo por API reinicia ese contador sin commits.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/auto-fetch.yml/enable"
