name: Auto Fetch Actas
on:
  schedule:
    - cron: "17 10 * * *"  # instagram_publisher.py usa esta hora (CRON_TIME_UTC) para anunciar cuándo publica
  workflow_dispatch: {}
concurrency:
  group: instagram  # el estado de Instagram es leer-modificar-escribir: nunca dos corridas a la vez
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # rama instagram-media (imágenes públicas para Instagram)
      issues: write    # vistas previas y avisos de error
      actions: write   # para el keepalive
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Run tests
        id: tests
        run: |
          python -m unittest discover -v
      - name: Run auto_fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          SOURCE_URL: "https://prensacd.cdsma.gob.ar/ordenes-del-dia-2026/"
        run: |
          python auto_fetch.py
      # Sin SOURCE_URL: mira la página del año en curso aunque auto_fetch siga apuntando a otra.
      - name: Control de salud
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          IG_TOKEN_EXPIRES: ${{ secrets.IG_TOKEN_EXPIRES }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python health_check.py
      # Corre aunque auto_fetch falle (puede haber vistas previas pendientes), pero no si fallaron los tests.
      - name: Instagram
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python instagram_publisher.py
      # GitHub desactiva los crons tras 60 días sin actividad en el repo; re-habilitarlo por API reinicia ese contador sin commits.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/auto-fetch.yml/enable"
