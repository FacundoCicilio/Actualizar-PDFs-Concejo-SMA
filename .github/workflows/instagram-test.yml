name: Probar Instagram
on:
  workflow_dispatch:
    inputs:
      orden:
        description: "Número de orden del día (por ejemplo 23)"
        required: true
      anio:
        description: "Año (vacío = el actual)"
        required: false
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # rama instagram-media
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      # Abre un Issue con la vista previa; no publica ni toca el estado del período de prueba.
      - name: Vista previa
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ORDEN: ${{ inputs.orden }}
          ANIO: ${{ inputs.anio }}
        run: |
          python instagram_publisher.py --prueba "$ORDEN" ${ANIO:+--anio "$ANIO"}
